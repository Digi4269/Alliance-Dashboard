<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner of Death - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }
        .login-box h1 {
            color: #d4a017;
            font-size: 1.5em;
            margin-bottom: 8px;
        }
        .login-box .subtitle {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 28px;
        }
        .login-box input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 1em;
            margin-bottom: 16px;
            outline: none;
        }
        .login-box input[type="password"]:focus {
            border-color: #d4a017;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #d4a017;
            color: #0f0f1a;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #e6b422;
        }
        .error {
            color: #ff6b6b;
            font-size: 0.85em;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>&#127984; Banner of Death</h1>
        <div class="subtitle">Alliance Dashboard</div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Enter passphrase" autofocus>
            <button type="submit">Enter</button>
        </form>
    </div>
</body>
</html>
